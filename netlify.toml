[build]
  command = "npx @agent-native/core@latest deploy --preset netlify --build-only"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_CONFIG_PRODUCTION = "false"

[functions."*"]
  timeout = 75

# Baseline security headers for every response. A full Content-Security-Policy
# is deliberately not set here yet — it needs testing against each app's real
# script/style/font origins first, and a wrong CSP can break the whole site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Root → Dispatch (workspace control plane)
[[redirects]]
  from = "/"
  to = "/dispatch/overview"
  status = 302

[[redirects]]
  from = "/overview"
  to = "/dispatch/overview"
  status = 302

[[redirects]]
  from = "/login"
  to = "/dispatch/login"
  status = 302

[[redirects]]
  from = "/vault"
  to = "/dispatch/vault"
  status = 302

# Public privacy policy for the Builder.LI Chrome extension listing
[[redirects]]
  from = "/privacy"
  to = "/li-agent/privacy"
  status = 301

# SettingsTabsPage (framework component, used by every app's settings.tsx)
# reflects the active tab in the URL via a raw window.history.pushState, not
# real React Router navigation -- so only "/settings" is ever a real,
# server-matched route; a direct load or reload of "/settings/<tab>" hits the
# server with no matching route and 404s, even though clicking a tab in a
# live session works fine (client-side only, no request ever made). These
# rewrites (200, not a redirect) serve the real "/settings" route's content
# while leaving the browser's URL untouched, so the client can still read
# window.location on hydration and show the right tab.
[[redirects]]
  from = "/dispatch/settings/*"
  to = "/dispatch/settings"
  status = 200

[[redirects]]
  from = "/li-agent/settings/*"
  to = "/li-agent/settings"
  status = 200

[[redirects]]
  from = "/booking/settings/*"
  to = "/booking/settings"
  status = 200

[[redirects]]
  from = "/prospecting-hub/settings/*"
  to = "/prospecting-hub/settings"
  status = 200

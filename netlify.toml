[build]
  # The repo's pinned, patched core (see pnpm-workspace.yaml), not @latest:
  # npx @latest ran a newer core from its own cache, which could not see the
  # repo's vite and drifted from the pinned 0.176.4.
  command = "pnpm exec agent-native deploy --preset netlify --build-only"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_CONFIG_PRODUCTION = "false"

[functions."*"]
  timeout = 75

# Baseline security headers for every response. A full Content-Security-Policy
# is deliberately not set here yet — it needs testing against each app's real
# script/style/font origins first, and a wrong CSP can break the whole site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Root → Dispatch (workspace control plane)
[[redirects]]
  from = "/"
  to = "/dispatch/overview"
  status = 302

[[redirects]]
  from = "/overview"
  to = "/dispatch/overview"
  status = 302

[[redirects]]
  from = "/login"
  to = "/dispatch/login"
  status = 302

[[redirects]]
  from = "/vault"
  to = "/dispatch/vault"
  status = 302

# Public privacy policy for the Builder.LI Chrome extension listing
[[redirects]]
  from = "/privacy"
  to = "/li-agent/privacy"
  status = 301

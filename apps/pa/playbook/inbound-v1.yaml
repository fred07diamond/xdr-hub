  - id: rule.routing.by_class
    block: class_routes
    section: routing
    position: 0
    type: rule
    owner: Sales leadership
    owner_team: both
    precedence: 2
    version: 1
    body: |
      Routing happens after the lead is triaged, and it decides whose meeting link goes in the email.
      A good fit for enterprise goes to the AE: the account's AE in HubSpot, else the PA's pod AE. The email carries the AE's meeting link to speed up the sales process.
      A lead the PA thinks has potential, but that is not an enterprise fit yet, is the PA's call: the email carries the PA's own meeting link.
      Anything unclear qualifies first with questions and no link. The PA can change the route on any lead.
    params:
      hq_content: route_to_ae
      hq_code: route_to_ae
      standard_content: qualify_first
      standard_code: qualify_first
      content_price_check: qualify_first
      agency: agency
    rationale: "Fred, 2026-09-30: the lead is routed from the PA to the AE once it meets the enterprise bar; otherwise the PA takes the call."
  - id: rule.sla.first_touch
    block: clock
    section: clocks
    position: 0
    type: rule
    owner: RevOps and PA lead
    owner_team: both
    precedence: 2
    version: 1
    params:
      minutes: 30
      clock: owner_working_hours
      reminder_at_fraction: 0.75
      breach_notify: pa_lead
    source: "Sales handbook, 03 Lead routing: Contact Sales responds within 30 minutes"
  - id: rule.sla.decision
    block: clock
    section: clocks
    position: 1
    type: rule
    owner: RevOps
    owner_team: revops

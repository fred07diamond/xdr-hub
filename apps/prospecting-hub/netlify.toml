publish = "apps/prospecting-hub/dist"
functions = "apps/prospecting-hub/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"

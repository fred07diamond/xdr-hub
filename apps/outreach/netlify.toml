[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/chat VITE_APP_BASE_PATH=/chat NITRO_PRESET=netlify pnpm --filter chat build"
publish = "apps/chat/dist"
functions = "apps/chat/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

  APP_BASE_PATH = "/chat"
  VITE_APP_BASE_PATH = "/chat"
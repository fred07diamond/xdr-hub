<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Builder.LI — Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      max-width: 480px;
      margin: 48px auto;
      padding: 0 24px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #0a66c2; margin-bottom: 8px; }
    p { color: #555; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 20px; }
    .hint { font-size: 12px; color: #777; margin-top: 4px; font-weight: 400; }
    input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #0a66c2; }
    button {
      margin-top: 4px;
      padding: 10px 20px;
      background: #0a66c2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #004182; }
    #status { margin-top: 10px; font-size: 13px; color: #1e7e34; min-height: 18px; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0; }
  </style>
</head>
<body>
  <h1>Builder.LI Settings</h1>
  <p>Configure your outreach app connection below.</p>

  <div class="field">
    <label for="app-url">Outreach app URL</label>
    <span class="hint">The URL where your Builder.LI app is running.</span>
    <input id="app-url" type="url" placeholder="https://your-app.example.com/outreach" style="margin-top:6px" />
  </div>

  <div class="field">
    <label for="api-token">Personal API Token</label>
    <span class="hint">Copy this from Settings → Personal API Token in your app.</span>
    <input id="api-token" type="text" placeholder="Paste your token here" style="margin-top:6px;font-family:monospace" />
  </div>

  <button id="save-btn">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
